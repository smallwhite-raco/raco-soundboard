  body {
    font-family: "Segoe UI", sans-serif;
    background: #f9f9f9;
    text-align: center;
    margin: 0;
    padding: 20px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  h1 {
    margin-bottom: 30px;
    color: #333;
  }

  .category {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    margin: 20px auto;
    padding: 20px;
    max-width: 600px;
  }

  .category h2 {
    margin-bottom: 15px;
    color: #444;
  }

  .line-button {
    display: inline-block;
    width: 45%;
    margin: 8px;
    padding: 12px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: #fffae6;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }

  .line-button:hover {
    background: #ffe066;
    transform: scale(1.05);
  }

  #globalPlayer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #fff;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
    padding-bottom: env(safe-area-inset-bottom);
  }

  @media (max-width: 600px) {
    #globalPlayer {
      height: 40px;
    }
    body {
      padding-bottom: calc(50px + env(safe-area-inset-bottom));
    }
  }
  </style>

</head>

    for (let category in categories) {
      let div = document.createElement("div");
      div.className = "category";
      div.innerHTML = `<h2>${category}</h2>`;
      categories[category].forEach(line => {
        let btn = document.createElement("button");
        btn.className = "line-button";
        btn.textContent = line.text;
        btn.onclick = () => playSound(line.file);
        div.appendChild(btn);
      });
      board.appendChild(div);
    }

    function playSound(file) {
      const player = document.getElementById("globalPlayer");
      player.src = file;
      player.play();
    }

  <audio id="globalPlayer" controls></audio>
